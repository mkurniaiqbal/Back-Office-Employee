<div class="animate-up">
  <div class="mb-4 d-flex align-items-center gap-3">
    <button
      class="btn btn-light rounded-circle border shadow-sm"
      (click)="kembali()"
    >
      <i class="bi bi-arrow-left"></i>
    </button>
    <div>
      <h5 class="fw-bold text-dark mb-1">
        {{ isEdit ? "Edit" : "Add" }} Employee
      </h5>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
          <li class="breadcrumb-item" style="font-size: 11px">
            <a routerLink="/employees" class="text-decoration-none text-muted">
              Employees
            </a>
          </li>

          <li
            class="breadcrumb-item active text-primary"
            style="font-size: 11px"
            aria-current="page"
          >
            Employees {{ isEdit ? "Edit" : "Add" }}
          </li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
    <div class="card-header bg-white border-0 py-3 ps-4">
      <div class="d-flex align-items-center gap-2">
        <div class="bg-primary bg-opacity-10 p-2 rounded-3">
          <i class="bi bi-person-plus-fill text-primary"></i>
        </div>

        <h5 class="mb-0 fw-bold text-dark">Detail Informasi</h5>
      </div>
    </div>

    <div class="card-body p-4 p-lg-4">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="row g-4">
          <!-- Username -->
          <div class="col-md-6">
            <app-floating-input
              id="username"
              label="Username"
              formControlName="username"
            >
            </app-floating-input>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <app-floating-input
              formControlName="email"
              type="email"
              label="Email"
              id="email"
            ></app-floating-input>
          </div>

          <!-- First Name -->
          <div class="col-md-6">
            <app-floating-input
              id="firstName"
              label="First Name"
              formControlName="firstName"
            >
            </app-floating-input>
          </div>

          <!-- Last Name -->
          <div class="col-md-6">
            <app-floating-input
              id="lastName"
              label="Last Name"
              formControlName="lastName"
            >
            </app-floating-input>
          </div>

          <!-- Birth Date -->
          <div class="col-md-6">
            <app-floating-input
              id="birthDate"
              type="date"
              label="Birth Date"
              [max]="today"
              formControlName="birthDate"
            >
            </app-floating-input>
          </div>

          <!-- Basic Salary -->
          <div class="col-md-6">
            <div class="input-group">
              <span class="input-group-text">Rp</span>

              <app-floating-input
                class="flex-grow-1"
                id="basicSalary"
                type="currency"
                label="Basic Salary"
                formControlName="basicSalary"
              >
              </app-floating-input>
            </div>

            <!-- ERROR BASIC SALARY ONLY -->
            @if (
              form.get("basicSalary")?.invalid &&
              form.get("basicSalary")?.touched
            ) {
              <div class="text-danger mt-1">
                @if (form.get("basicSalary")?.errors?.["min"]) {
                  <small>Basic Salary wajib diisi</small>
                }
              </div>
            }
          </div>

          <!-- Status -->
          <div class="col-md-6">
            <app-floating-select
              id="status"
              label="Status"
              [items]="status"
              formControlName="status"
            ></app-floating-select>
          </div>

          <!-- Cukup ganti nama tag-nya saja -->
          <div class="col-md-6">
            <app-floating-search-select
              id="group"
              label="Group"
              [items]="groups"
              formControlName="group"
            >
            </app-floating-search-select>
          </div>

          <div class="col-md-12">
            <app-floating-input
              id="description"
              type="datetime-local"
              label="Description"
              formControlName="description"
            >
            </app-floating-input>
          </div>

          <!-- Description -->
          <!-- <div class="col-12">
            <div class="form-floating">
              <textarea
                class="form-control"
                id="description"
                style="height: 120px"
                placeholder="Description"
                formControlName="description"
                [class.is-invalid]="
                  form.get('description')?.invalid &&
                  form.get('description')?.touched
                "
              >
              </textarea>

              <label for="description"> Description </label>
            </div>
            @if (
              form.get("description")?.invalid &&
              form.get("description")?.touched
            ) {
              <div class="text-danger mt-1">
                <small>Description wajib diisi</small>
              </div>
            }
          </div> -->
        </div>

        <div class="d-flex justify-content-end gap-3 mt-5 pt-4 border-top">
          <button type="button" class="btn btn-light border" (click)="cancel()">
            Cancel
          </button>

          <button
            type="submit"
            class="btn"
            [ngClass]="form.invalid ? 'btn-secondary' : 'btn-utama-biru'"
            [disabled]="form.invalid"
          >
            {{ isEdit ? "Update Employee" : "Add Employee" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
