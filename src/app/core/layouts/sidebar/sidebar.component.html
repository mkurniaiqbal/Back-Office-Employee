<div class="sidebar-wrapper d-flex flex-column h-100">
  <div class="brand-section px-3 py-4 d-flex align-items-center gap-3">
    <div
      class="logo-icon bg-gradient-primary rounded-3 d-flex align-items-center justify-content-center"
    >
      <i class="bi bi-buildings-fill text-white fs-5"></i>
    </div>
    <h4 class="text-white fw-bold mb-0 brand-text">
      Back<span class="text-primary-light">Office</span>
    </h4>
  </div>

  <hr class="sidebar-divider mx-3" />

  <nav class="sidebar-nav flex-grow-1 px-2">
    <ul class="nav flex-column gap-1">
      <li class="nav-item" *ngFor="let menu of sidebarMenus">
        <a
          class="nav-link custom-nav-link d-flex align-items-center"
          [routerLink]="menu.link"
          routerLinkActive="active-link"
          (click)="closeMobileSidebar()"
        >
          <div
            class="icon-wrapper d-flex align-items-center justify-content-center"
          >
            <i [class]="menu.icon"></i>
          </div>
          <span class="menu-label ms-2">{{ menu.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="user-profile-card m-3 p-3 rounded-4">
    <div class="d-flex align-items-center gap-3">
      <div class="position-relative">
        <img
          src="https://ui-avatars.com/api/?name=Admin+User&background=6366f1&color=fff"
          class="rounded-circle shadow-sm"
          width="38"
        />
        <span class="status-indicator"></span>
      </div>
      <div class="overflow-hidden">
        <p class="text-white mb-0 small fw-bold text-truncate">Admin User</p>
        <small class="text-muted-sidebar">Administrator</small>
      </div>
    </div>
  </div>
</div>
